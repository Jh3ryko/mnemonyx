<meta name="author" content="Kymera Software Studio">
<meta name="copyright" content="Kymera Software Studio - All rights reserved">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Mnemonyx</title>
<style>
:root{--bg:#0B0B0F;--panel:#14141B;--panel2:#1D1D28;--line:#2B2B3A;--p:#8B5CF6;--p2:#B197FC;--text:#E9E7F2;--muted:#9390A8;--err:#F87171;--sw:264px;--sc:64px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
[hidden]{display:none!important}
.word{font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;letter-spacing:.04em}

/* Accesso */
#login{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(70% 55% at 50% 0,#2b1857 0,transparent 70%),var(--bg)}
#lf{width:100%;max-width:370px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:34px 28px 28px;display:grid;gap:14px;box-shadow:0 24px 70px #000a}
#lf .lg{justify-self:center}
#lf h1{text-align:center;font-size:34px;font-weight:500;line-height:1.1}
.sub{text-align:center;color:var(--muted);margin-top:-8px;font-style:italic}
label{display:grid;gap:6px;color:var(--muted);font-size:13px}
input[type=email],input[type=password]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text)}
input:focus{border-color:var(--p);outline:none}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.btn{border:0;border-radius:10px;padding:12px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#6D28D9,#A78BFA);color:#fff}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--p2);font-weight:400}
.btn.ghost:hover{border-color:var(--p);filter:none}
#err{min-height:20px;color:var(--err);font-size:13px;text-align:center}

/* App */
#app{display:flex;height:100dvh}
#side{width:var(--sw);flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:width .2s,transform .2s}
.sh{display:flex;align-items:center;gap:10px;height:60px;padding:0 12px;border-bottom:1px solid var(--line)}
.sh b{flex:1;font-size:20px;font-weight:500;white-space:nowrap}
#tog{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--p2);cursor:pointer;font-size:18px;line-height:1;transition:transform .2s}
#tog:hover{background:var(--panel2)}
body.collapsed #tog{transform:rotate(180deg)}
#nav{flex:1;overflow:auto;padding:10px 8px}
.ni,.gh,#out{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;text-align:left;white-space:nowrap}
.ni:hover,.gh:hover,#out:hover{background:var(--panel2);color:var(--text)}
.ni.act{background:#8b5cf620;color:var(--p2);box-shadow:inset 3px 0 var(--p)}
.ic{width:22px;flex:none;text-align:center;font-size:17px}
.gh{margin-top:10px;font-weight:600;color:var(--text)}
.gh small{font-weight:400;color:var(--muted);font-style:italic}
.chv{margin-left:auto;transition:transform .2s}
.grp:not(.open) .items{display:none}
.grp:not(.open) .chv{transform:rotate(-90deg)}
.items .ni{padding-left:24px}
.sf{padding:8px;border-top:1px solid var(--line)}

main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;height:60px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
#ttl{flex:1;font-size:18px;font-weight:600}
#usr{color:var(--muted);font-size:13px}
#mob{display:none;background:none;border:0;font-size:22px;cursor:pointer;color:var(--p2)}
#mic{width:40px;height:40px;border-radius:50%;border:1px solid var(--p);background:none;color:var(--p2);cursor:pointer;display:grid;place-items:center}
#mic:hover{background:#8b5cf622}
#mic.on{background:var(--p);color:#fff;animation:pl 1.1s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px #8b5cf633}}
#view{flex:1;overflow:auto;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.card small{color:var(--muted)}
.card .n{font-size:30px;color:var(--p2);line-height:1.3}
.hint{margin-top:16px;color:var(--muted)}
.big{max-width:620px}
.big h1{font-size:26px;margin:10px 0 6px}
.big p{color:var(--muted);max-width:60ch}
.tag{display:inline-block;padding:2px 10px;border:1px solid var(--p);border-radius:99px;color:var(--p2);font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90%;background:var(--panel2);border:1px solid var(--p);border-radius:10px;padding:10px 16px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

.cr{color:var(--muted);font-size:11px;line-height:1.5;text-align:center}
.sf .cr{text-align:left;padding:8px 12px 0;white-space:normal}
.st{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;margin:16px 0}
.st legend{padding:0 6px;color:var(--p2)}
.st small{color:var(--muted)}
.info{color:var(--muted);font-size:13px}
.ck{font-size:clamp(40px,7vw,62px);font-weight:300;line-height:1.05;font-variant-numeric:tabular-nums}
.cd{color:var(--p2);font-size:17px;margin-top:4px}
.tk-wrap{overflow:hidden;margin:18px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 0}
.tk{display:flex;width:max-content;animation:sc 50s linear infinite}
.tk-wrap:hover .tk,.tk-wrap:focus-within .tk{animation-play-state:paused}
.tr{display:flex;gap:44px;padding-right:44px}
@keyframes sc{to{transform:translateX(-50%)}}
.ti,.ev{background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.ti{display:flex;align-items:center;gap:8px;white-space:nowrap}
.ti i,.ev>i{width:9px;height:9px;border-radius:50%;flex:none}
.ti span{color:var(--muted)}.ti span.a{color:#FBBF24}.ti span.r{color:var(--err)}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ch button{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--p2);cursor:pointer}
.cw,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cw span{color:var(--muted);font-size:12px}
.dy{aspect-ratio:1;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.dy:hover{background:var(--panel2)}
.dy em{display:flex;gap:2px;height:5px}
.dy em i{width:5px;height:5px;border-radius:50%}
.dy.td{border-color:var(--p)}
.dy.sl{background:#8b5cf630}
.ev{display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px 0;border-top:1px solid var(--line);margin-top:8px}
.ev>i{margin-top:7px}
.ev small{display:block;color:var(--muted)}

.ob{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.ob .btn{padding:9px 14px}
.or{display:grid;grid-template-columns:70px 84px 84px 140px 1fr;gap:8px;align-items:center;padding:6px 4px;border-top:1px solid var(--line)}
.or:first-child{border-top:0}
.or.we{background:#8b5cf612}
.or input,.or select,.par input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--text)}
.od{font-weight:600}
.oc{color:var(--muted);font-size:13px}
.par label{margin-top:8px}

#opay{margin:16px 0}
.pr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.pr input,#opay input{width:110px;margin-left:8px;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--text)}
.pr.tot{font-weight:600;color:var(--p2)}
.warn{margin-top:10px;color:#FBBF24}

.lamp{display:inline-block;width:12px;height:12px;margin-left:8px;border-radius:50%;background:#6b6b7a;vertical-align:middle}
.lamp.ok,.sem.ok i{background:#22C55E}.lamp.ko,.sem.ko i{background:#EF4444}.lamp.wa,.sem.wa i{background:#F59E0B}
.sem{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.sem i{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:0 0 16px currentColor}
.sem.ok{color:#22C55E}.sem.ko{color:#EF4444}.sem.wa{color:#F59E0B}
.sem div{color:var(--text)}.sem b{display:block;font-size:18px}.sem span{color:var(--muted)}
#rep h1{font-size:24px;margin:14px 0 2px}
#rep h3{margin:20px 0 6px;color:var(--p2)}
#rep ul{padding-left:20px}
.anl{padding:0;list-style:none}
.an{margin:10px 0;padding:10px 14px;border-left:4px solid var(--line);background:var(--panel2);border-radius:0 8px 8px 0}
.an.alta{border-color:#EF4444}.an.media{border-color:#F59E0B}.an.bassa{border-color:#38BDF8}
.an p{margin:4px 0;color:var(--muted)}

a.btn{text-decoration:none;display:inline-block;text-align:center}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:10px 0}
.sw h3{margin:22px 0 8px;color:var(--p2)}
.sw .card{margin-bottom:12px}
.sw input,.sw select,.sw textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit}
.sw textarea{min-height:70px;resize:vertical}
.pd summary{cursor:pointer;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pd h4{margin:16px 0 4px}
.dx{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.chip{padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.chip.s-Aperta{color:#F59E0B;border-color:#F59E0B}.chip.s-Intrattativa{color:#38BDF8;border-color:#38BDF8}.chip.s-Conciliazione{color:#A78BFA;border-color:#A78BFA}.chip.s-Ingiudizio{color:#F87171;border-color:#F87171}.chip.s-Chiusa{color:#22C55E;border-color:#22C55E}

.mv{display:grid;grid-template-columns:150px 110px 1.2fr 1.6fr 44px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.mv:first-child{border-top:0}
.mv.pv{grid-template-columns:70px 1fr 110px auto}
.mv.rc{grid-template-columns:1.4fr 100px 1.2fr 80px 150px 80px 44px}
.br{display:grid;grid-template-columns:190px 1fr 190px;gap:12px;align-items:center;padding:5px 0}
.br b{text-align:right;font-weight:500}
.bb{position:relative;height:12px;background:var(--panel2);border-radius:6px}
.bb i{display:block;height:100%;border-radius:6px;background:var(--p)}
.bb i.w{background:#F59E0B}.bb i.x{background:#EF4444}
.bb u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text)}

.mvw{border-top:1px solid var(--line);padding:6px 0}
.mvw:first-child{border-top:0}
.mvw .mv{border-top:0;padding:4px 0}
.nf{display:flex;gap:8px;flex-wrap:wrap;padding:2px 0 4px}
.nf select,.nf input{width:auto;min-width:150px;max-width:230px}
.cmpw{overflow-x:auto}
table.cmp{width:100%;border-collapse:collapse}
.cmp th,.cmp td{padding:7px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.cmp th{color:var(--muted);font-weight:500}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp .cu{background:#8b5cf61a;font-weight:600}
.cmp .tt td{font-weight:600}
.cmp .up{color:#F87171}.cmp .down{color:#22C55E}

.chip.c-x{color:#F87171;border-color:#F87171}.chip.c-w{color:#F59E0B;border-color:#F59E0B}.chip.c-ok{color:#22C55E;border-color:#22C55E}
.mzr{border-top:1px solid var(--line);padding:10px 0}
.mzr .ob{margin:6px 0 0;align-items:center}
.pd summary small{color:var(--muted)}
.mzs .card .n{font-size:22px}

.chip.c-n{color:var(--muted)}

.lb{position:fixed;inset:0;background:#000e;z-index:50;overflow:auto;padding:16px}
.lb img{max-width:100%;display:block;margin:12px auto;border-radius:8px}
.lbw{max-width:760px;margin:0 auto 24px}
label.fl{cursor:pointer}

@media(min-width:769px){
 body.collapsed #side{width:var(--sc)}
 body.collapsed .lbl,body.collapsed .sh .lg{display:none}
 body.collapsed .sh{justify-content:center;padding:0}
 body.collapsed .grp .items{display:block}
 body.collapsed .items .ni{padding-left:12px}
}
@media(max-width:768px){
 #side{position:fixed;inset:0 auto 0 0;z-index:20;box-shadow:10px 0 40px #000b}
 body.collapsed #side{transform:translateX(-100%)}
 #mob{display:block}
 #usr{display:none}
 #view{padding:16px}
 .cols{grid-template-columns:1fr}
 .or{grid-template-columns:58px 1fr 1fr}
 .mv,.mv.rc{grid-template-columns:1fr 1fr}
 .mv.pv{grid-template-columns:50px 1fr auto}
 .mv input[data-f=t],.mv select{grid-column:1/3}
 .br{grid-template-columns:1fr}
 .br b{text-align:left}
 .or select,.oc{grid-column:2/4}
}
@media print{
 :root{--bg:#fff;--panel:#fff;--panel2:#f4f4f7;--text:#111;--muted:#444;--line:#ccc;--p:#5B21B6;--p2:#4C1D95}
 #side,header,.noprint,#toast{display:none!important}
 html,body,#app{height:auto;display:block}
 body{background:#fff}
 main{display:block}
 #view{overflow:visible;padding:0}
 #rep{border:0;padding:0}
 .sem i{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:none}
 .an{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(prefers-reduced-motion:reduce){*:not(.tk){transition:none!important;animation:none!important}body.tk-sys .tk{animation:none;width:auto}body.tk-sys .tr{flex-wrap:wrap;gap:10px 28px}body.tk-sys .tk-dup{display:none}}
body.tk-off .tk{animation:none;width:auto}body.tk-off .tr{flex-wrap:wrap;gap:10px 28px}body.tk-off .tk-dup{display:none}
</style>
</head>

    <span class="lg"></span>
    <h1 class="word">Mnemonyx</h1>

async function authReq(path, body) {
  if (!CFG.url) throw new Error('Configura url e key di Supabase all\'inizio del file.');
  const r = await fetch(CFG.url + '/auth/v1/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.key }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'Accesso non riuscito.');
  return j;
}
const loadS = () => JSON.parse(localStorage.getItem('mnx_s') || sessionStorage.getItem('mnx_s') || 'null');
function saveS(j, remember) {
  const [on, off] = remember ? [localStorage, sessionStorage] : [sessionStorage, localStorage];
  on.setItem('mnx_s', JSON.stringify({ access_token: j.access_token, refresh_token: j.refresh_token, email: (j.user && j.user.email) || (loadS() || {}).email }));
  off.removeItem('mnx_s');
}
function logout(msg) {
  localStorage.removeItem('mnx_s'); sessionStorage.removeItem('mnx_s');

let TOK = '', pushT;
const dirty = new Set(JSON.parse(localStorage.getItem('mnx_dirty') || '[]'));
function syncUI(s, t) { const e = $('sync'); if (!e) return; e.hidden = !TOK; e.className = 'lamp ' + s; e.title = t; }
async function refreshTok() {
  const s = loadS(); if (!s) return false;
  try { const j = await authReq('token?grant_type=refresh_token', { refresh_token: s.refresh_token }); saveS(j, !!localStorage.getItem('mnx_s')); TOK = j.access_token; return true; } catch (e) { return false; }
}
async function api(path, opt = {}, retry = true) {
  const r = await fetch(CFG.url + '/rest/v1/' + path, { ...opt, headers: { apikey: CFG.key, Authorization: 'Bearer ' + TOK, 'Content-Type': 'application/json', ...(opt.headers || {}) } });
  if (r.status === 401 && retry && await refreshTok()) return api(path, opt, false);
  if (!r.ok) throw new Error(await r.text());
  return r;
}
function touch(k) {
  if (!TOK) return;
  localStorage.setItem('mnx_mod_' + k, new Date().toISOString()); dirty.add(k);
  localStorage.setItem('mnx_dirty', JSON.stringify([...dirty]));
  syncUI('wa', 'Modifiche da sincronizzare'); clearTimeout(pushT); pushT = setTimeout(push, 1500);
}
async function push() {
  if (!TOK || !dirty.size) return;
  try {
    syncUI('wa', 'Sincronizzazione in corso');
    const mk = [...dirty].filter(k => k === 'mnx_ore' || k === 'mnx_ced' || MERGERS[k]);   // prima di scrivere, unisco con quanto scritto da altri dispositivi
    if (mk.length) {
      const rem = await (await api('mnx_dati?select=chiave,valore&chiave=in.(' + mk.join(',') + ')')).json();
      rem.forEach(r => { const lraw = localStorage.getItem(r.chiave); let loc = {}; try { loc = JSON.parse(lraw) || {}; } catch (e) {} const t = JSON.stringify(MERGERS[r.chiave] ? MERGERS[r.chiave](loc, r.valore) : { ...r.valore, ...loc }); if (t !== lraw) localStorage.setItem(r.chiave, t); });
    }
    const rows = [...dirty].filter(k => localStorage.getItem(k) !== null).map(k => {
      const v = localStorage.getItem(k); let val; try { val = JSON.parse(v); } catch (e) { val = v; }
      return { chiave: k, valore: val, aggiornato: localStorage.getItem('mnx_mod_' + k) || new Date().toISOString() };
    });
    if (rows.length) await api('mnx_dati?on_conflict=user_id,chiave', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(rows) });
    dirty.clear(); localStorage.setItem('mnx_dirty', '[]'); syncUI('ok', 'Dati sincronizzati');
  } catch (e) { syncUI('ko', 'Sincronizzazione non riuscita: riprovo appena possibile'); }
}
async function pull() {
  if (!TOK) return false;
  try {
    syncUI('wa', 'Sincronizzazione in corso');
    const rows = await (await api('mnx_dati?select=chiave,valore,aggiornato')).json(), now = () => new Date().toISOString();
    rows.filter(r => BK.includes(r.chiave)).forEach(r => {
      const k = r.chiave, lraw = localStorage.getItem(k), lmod = localStorage.getItem('mnx_mod_' + k);
      let loc = null; try { loc = lraw === null ? null : JSON.parse(lraw); } catch (e) { loc = lraw; }
      const remNewer = !lmod || new Date(r.aggiornato) > new Date(lmod), merge = k === 'mnx_ore' || k === 'mnx_ced';
      const out = loc === null ? r.valore : MERGERS[k] ? MERGERS[k](loc, r.valore) : merge ? (remNewer ? { ...loc, ...r.valore } : { ...r.valore, ...loc }) : (remNewer ? r.valore : loc);
      const s = typeof out === 'string' ? out : JSON.stringify(out);
      if (s !== lraw) localStorage.setItem(k, s);
      if (JSON.stringify(out) !== JSON.stringify(r.valore)) { dirty.add(k); localStorage.setItem('mnx_mod_' + k, now()); }
      else localStorage.setItem('mnx_mod_' + k, r.aggiornato);
    });
    BK.forEach(k => { if (localStorage.getItem(k) !== null && !rows.some(r => r.chiave === k)) { dirty.add(k); localStorage.setItem('mnx_mod_' + k, now()); } });
    localStorage.setItem('mnx_dirty', JSON.stringify([...dirty]));
    await push(); return true;
  } catch (e) { syncUI('ko', 'Offline o errore: uso i dati salvati su questo dispositivo'); return false; }
}

const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dayDiff = s => Math.round((new Date(s + 'T00:00') - new Date(ymd(new Date()) + 'T00:00')) / 864e5);

const cap = s => s[0].toUpperCase() + s.slice(1);
const evTitle = e => e.s === 'salute' ? (e.k === 'promemoria' ? 'Promemoria salute' : 'Appuntamento') : e.p ? 'Scadenza riservata' : e.t;   // privacy: niente dettagli medici in dashboard

function loadEvents() {   // scadenze delle pratiche sindacali (mostrate in forma riservata)
  loadSD(); loadSP(); const ev = SD.pr.filter(p => !p.del && p.scad && p.stato !== 'Chiusa').map(p => ({ t: p.titolo || 'Pratica', d: p.scad, s: 'work', k: 'scadenza', p: 1 })), t = new Date();
  [0, 1].forEach(o => { const m = new Date(t.getFullYear(), t.getMonth() + o, 1); previste(m.getFullYear(), m.getMonth()).forEach(x => ev.push({ t: x.r.t || 'Spesa', d: x.date, s: 'spese', k: 'scadenza' })); });
  loadMZ(); L2(MZ.v).forEach(v => L2(v.sc).filter(x => x.d && dayDiff(x.d) >= -30).forEach(x => ev.push({ t: ((x.tipo || 'Scadenza') + ' ' + (v.nome || '')).trim(), d: x.d, s: 'mezzi', k: 'scadenza' })));

  loadSP(); const m = SP.mov.find(x => x.id === id); if (!m) return; m.ft = m.ft || []; let n = 0;
  for (const f of files) {
    try { const blob = await shrink(f), path = `${uidTok()}/sp/${id}-${Date.now().toString(36)}${n++}.jpg`; await idbDo('readwrite', s => s.put({ path, blob })); m.ft.push(path); }
    catch (e) { say('Non riesco a leggere questa immagine.'); }
  }
  m.u = nowI(); saveSP(); if ($('spr')) spRows(); say(n > 1 ? `${n} foto allegate.` : 'Foto allegata.'); flushUp();
}
async function fotoUrl(p) {
  if (FURL.has(p)) return FURL.get(p);
  let blob = null; try { const q = await idbDo('readonly', s => s.get(p)); blob = q && q.blob; } catch (e) {}
  if (!blob) blob = await (await stFetch('GET', 'authenticated/' + BUCKET + '/' + p)).blob();
  const u = URL.createObjectURL(blob); FURL.set(p, u); return u;
}
async function showFoto(id) {
  loadSP(); const m = SP.mov.find(x => x.id === id); if (!m || !(m.ft || []).length) return;
  const lb = document.createElement('div'); lb.className = 'lb'; lb.innerHTML = '<div class="ob"><button class="btn" id="lbx">Chiudi</button></div><div id="lbi"></div>';
  document.body.appendChild(lb); lb.querySelector('#lbx').onclick = () => lb.remove(); const box = lb.querySelector('#lbi');
  for (const p of m.ft) {
    const w = document.createElement('div'); w.className = 'lbw'; w.innerHTML = '<p class="hint">Carico la foto…</p>'; box.appendChild(w);
    try {
      const u = await fotoUrl(p); w.innerHTML = `<img src="${u}" alt="Foto dello scontrino"><div class="ob"><button class="btn ghost">Elimina questa foto</button></div>`;
      w.querySelector('button').onclick = async () => {
        if (!confirm('Eliminare questa foto?')) return;
        loadSP(); const mm = SP.mov.find(x => x.id === id); mm.ft = (mm.ft || []).filter(x => x !== p); mm.u = nowI(); saveSP(); w.remove(); if ($('spr')) spRows();
        try { await idbDo('readwrite', s => s.delete(p)); } catch (e) {} stFetch('DELETE', BUCKET + '/' + p).catch(() => {});
      };
    } catch (e) { w.innerHTML = '<p class="warn">Non riesco a caricare la foto: sei offline, oppure la cartella su Supabase non è configurata.</p>'; }
  }
}
const fotoHtml = x => `<div class="nf"><label class="btn ghost fl">Scatta foto<input type="file" accept="image/*" capture="environment" data-ph="${x.id}" hidden></label><label class="btn ghost fl">Dalla galleria<input type="file" accept="image/*" multiple data-ph="${x.id}" hidden></label>${(x.ft || []).length ? `<button class="btn ghost" data-act="vedifoto" data-id="${x.id}">Vedi foto (${x.ft.length})</button>` : ''}</div>`;
addEventListener('online', () => flushUp());

/* ---------- Voce ---------- */
let tT;
function say(t) {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'it-IT'; speechSynthesis.speak(u); } catch (e) {}
  const el = $('toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(tT); tT = setTimeout(() => el.classList.remove('on'), 3500);
}
function handle(raw) {
  const t = raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const w = t.split(/\s+/);
  if (/\bmenu\b/.test(t)) {
    const close = /chiud|nascond/.test(t); setCol(close); return say(close ? 'Menu chiuso.' : 'Menu aperto.');
  }
  if (/\b(esci|logout|disconnetti)/.test(t)) { say('Arrivederci.'); return logout(); }
  const ms = t.match(/(?:speso|pagato|spesa di)\s+(\d+(?:[.,]\d+)?)\s*euro\s*(?:di|per|in|al|alla|dal|dalla)?\s*(.*)/); if (ms) return addSpesaVoce(parseFloat(ms[1].replace(',', '.')), ms[2]);
  const mo = t.match(/(\d+(?:[.,]\d+)?)\s*ore/); if (mo && /oggi|lavorat/.test(t)) return setToday(parseFloat(mo[1].replace(',', '.')));
  if (/(assicuraz|bollo|revision|tagliando|gomme)/.test(t) && /(quando|scad)/.test(t)) return speakMezzi(t);
  if (/(cosa ho|agenda|scadenz|appuntament|prossim)/.test(t)) return speakAgenda(t);
  const hit = ALL.find(a => a.k.some(k => w.some(x => x.startsWith(k))));
  if (hit) { go(hit.id); return say('Apro ' + hit.t.toLowerCase() + '.'); }
  say('Non ho capito. Prova con: apri spese.');
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen() {
  if (!SR) return say('Questo browser non supporta il riconoscimento vocale. Usa Chrome o Edge.');
  const r = new SR(); r.lang = 'it-IT'; r.interimResults = false;
  r.onstart = () => $('mic').classList.add('on');
  r.onend = () => $('mic').classList.remove('on');
  r.onerror = () => say('Non ho sentito nulla.');
  r.onresult = e => handle(e.results[0][0].transcript);
  try { speechSynthesis.cancel(); r.start(); } catch (e) {}
}
$('mic').onclick = listen;
addEventListener('keydown', e => { if (e.altKey && e.key.toLowerCase() === 'm' && !$('app').hidden) { e.preventDefault(); listen(); } });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
